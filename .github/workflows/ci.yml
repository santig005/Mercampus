name: CI - Quality Check

on:
  pull_request:
    branches:
      - main
      - develop
      - agent/develop
  push:
    branches:
      - main
      - develop
      - agent/develop

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Misma puerta que en local: scripts/verify.mjs corre lint, test y build,
      # e inyecta los placeholders de ImageKit que el build necesita. Definir
      # aqui los pasos por separado los dejaria divergir de los de local.
      - name: Verify (lint + test + build)
        run: npm run verify
